<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIM2: SNIPER OPS</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- THEME: DARK TACTICAL UI --- */
        :root { 
            --bg-ui: #050505; 
            --panel: rgba(10, 10, 10, 0.95); 
            --panel-border: #333;
            --accent: #ff9d00; /* Amber */
            --text: #e0e0e0;
            --danger: #d63031;
            --hud-bg: rgba(0, 0, 0, 0.7);
            --input-bg: #1a1a1a;
            --font-main: 'Black Ops One', cursive;
            --font-ui: 'Chakra Petch', sans-serif;
        }

        body { 
            margin: 0; overflow: hidden; background: #000; color: var(--text);
            font-family: var(--font-ui); user-select: none; -webkit-user-select: none;
            touch-action: none; /* Prevent browser zooming/scrolling */
        }

        /* --- LAYOUT --- */
        #game-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        /* --- MOBILE CONTROLS --- */
        #mobile-controls {
            display: none; /* Hidden on desktop by default, shown via JS detection */
            position: absolute; bottom: 20px; width: 100%; height: 200px; z-index: 50;
            pointer-events: auto;
        }

        #joystick-area {
            position: absolute; bottom: 20px; left: 30px; width: 140px; height: 140px;
            background: rgba(255, 255, 255, 0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
        }
        
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(255, 157, 0, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #sprint-toggle {
            position: absolute; bottom: 170px; left: 50px;
            width: 100px; height: 40px;
            background: rgba(0,0,0,0.6); border: 1px solid var(--accent);
            color: var(--accent); font-size: 0.8rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px; text-transform: uppercase; letter-spacing: 1px;
            transition: 0.2s;
        }
        #sprint-toggle.active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }

        #scope-btn {
            position: absolute; bottom: 40px; right: 40px; width: 120px; height: 120px;
            background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-family: var(--font-main); font-size: 1.2rem; letter-spacing: 1px;
            transition: 0.1s;
        }
        #scope-btn:active { background: var(--accent); color: #000; transform: scale(0.95); }

        /* --- MENUS --- */
        #menu-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #050505 0%, #111 100%);
        }

        .panel {
            background: var(--panel); border: 1px solid var(--panel-border); 
            padding: 30px; width: 90%; max-width: 450px; text-align: center; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 2px; 
            border-top: 4px solid var(--accent);
            position: relative;
        }
        
        /* Decorative corners for custom look */
        .panel::after {
            content: ''; position: absolute; bottom: 0; right: 0; width: 20px; height: 20px;
            border-bottom: 4px solid var(--accent); border-right: 4px solid var(--accent);
        }

        h1 { 
            font-family: var(--font-main); margin: 0 0 10px 0; 
            color: var(--accent); font-size: 2.5rem; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,157,0,0.3);
        }
        h2 { 
            font-family: var(--font-main); margin: 0 0 20px 0; font-size: 1.8rem; color: #fff; letter-spacing: 2px; 
        }
                
        input { 
            width: 100%; padding: 15px; background: var(--input-bg); border: 1px solid #444; 
            color: #fff; font-family: var(--font-ui); font-size: 1rem; text-align: center; 
            margin-bottom: 15px; outline: none; box-sizing: border-box; transition: 0.3s; 
            text-transform: uppercase; letter-spacing: 1.5px; border-radius: 2px;
        } 
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(255, 157, 0, 0.2); background: #222; }
        input[readonly] { color: var(--accent); font-family: monospace; font-size: 1.4rem; letter-spacing: 3px; border-color: var(--accent); background: #0f0f0f; }
        
        button { 
            width: 100%; padding: 15px; cursor: pointer; background: #1a1a1a; color: var(--accent); 
            border: 1px solid var(--accent); font-family: var(--font-main); font-size: 1.1rem; 
            text-transform: uppercase; transition: 0.2s; margin-bottom: 12px; letter-spacing: 1px;
            border-radius: 2px; position: relative; overflow: hidden;
        } 
        button:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px rgba(255,157,0,0.4); }
        button:disabled { opacity: 0.5; cursor: not-allowed; border-color: #333; color: #555; background: #111; box-shadow: none; }
                
        .btn-red { border-color: var(--danger); color: var(--danger); background: #1a0505; }
        .btn-red:hover { background: var(--danger); color: white; box-shadow: 0 0 20px rgba(214, 48, 49, 0.4); }

        /* --- FOOTER --- */
        .footer {
            margin-top: 20px; font-size: 0.8rem; color: #666; font-family: var(--font-ui);
        }
        .footer a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent); transition: 0.2s;}
        .footer a:hover { color: #fff; border-color: #fff; }

        /* --- HUD --- */
        #hud { display: none; width: 100%; height: 100%; pointer-events: none; }
        
        .score-box {
            position: absolute; top: 30px; font-family: var(--font-main); font-size: 1.5rem;
            padding: 10px 20px; background: var(--hud-bg); color: #fff;
            border-radius: 2px; font-variant-numeric: tabular-nums;
            border: 1px solid #333;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #score-p1 { left: 20px; text-align: left; border-left: 4px solid var(--accent); }
        #score-p2 { right: 20px; text-align: right; border-right: 4px solid var(--danger); }
                
        #win-limit {
            position: absolute; top: 10px; width: 100%; text-align: center;
            font-family: var(--font-ui); font-size: 0.8rem; color: #aaa; letter-spacing: 2px; text-transform: uppercase;
        }

        #killfeed {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            font-family: var(--font-main); font-size: 2.5rem; text-shadow: 0 4px 8px #000; text-align: center; color: var(--accent);
            opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; z-index: 5;
        }

        /* --- AMMO HUD --- */
        #ammo-hud {
            position: absolute; bottom: 30px; right: 30px;
            font-family: var(--font-main); font-size: 2.5rem; color: #fff; text-align: right;
            text-shadow: 0 2px 4px #000;
        }
        #ammo-label { font-family: var(--font-ui); font-size: 0.8rem; color: #aaa; display: block; margin-bottom: 5px;}
        #reloading-text { color: var(--danger); font-size: 1.2rem; display: none; animation: blink 0.5s infinite; margin-top:5px; }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- SCOPE --- */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.8; pointer-events: none; }
        .ch-line { position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
        .ch-v { width: 2px; height: 20px; left: 50%; top: 50%; transform: translate(-50%, -50%); } 
        .ch-h { width: 20px; height: 2px; left: 50%; top: 50%; transform: translate(-50%, -50%); }

        #hitmarker {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            width: 40px; height: 40px; opacity: 0; transition: transform 0.1s, opacity 0.2s; pointer-events: none;
        }
        .hm-line { position: absolute; background: #fff; width: 100%; height: 3px; top: 50%; left: 0; transform-origin: center; }
        .hm-1 { transform: rotate(45deg); }
        .hm-2 { transform: rotate(-45deg); }
        .hit-active { opacity: 1 !important; transform: translate(-50%, -50%) scale(1.2) !important; }

        /* Daytime Scope Styles */
        #scope {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; pointer-events: none; z-index: 20;
        }
        .scope-overlay {
            width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.6) 32%, #000 100%);
        }
        .scope-reticle { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90vh; height: 90vh; 
            border: 1px solid rgba(0,0,0,0.5); border-radius: 50%; 
            pointer-events: none; 
        }
        .scope-cross { position: absolute; background: #000; }
        .sc-v { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-50%); }
        .sc-h { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-50%); }
        .scope-center-dot {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 4px; height: 4px; background: red; border-radius: 50%;
            box-shadow: 0 0 4px red;
        }
        .scope-data { 
            position: absolute; color: #000; font-size: 14px; font-weight: bold; 
            left: 52%; top: 54%; font-family: monospace; text-shadow: 0 0 2px rgba(255,255,255,0.8);
        }

        /* --- REMATCH PANEL --- */
        #rematch-panel {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 200;
            flex-direction: column; align-items: center; justify-content: center; pointer-events: auto;
        }
        #rematch-panel h2 { font-family: var(--font-main); font-size: 3rem; margin-bottom: 20px; text-shadow: 0 0 20px currentColor; }
        .win-txt { color: #00ffcc; text-shadow: 0 0 20px #00ffcc; }
        .lose-txt { color: #ff3333; text-shadow: 0 0 20px #ff3333; }

        /* --- TOAST NOTIFICATIONS --- */
        #toast-container { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; pointer-events: none; z-index: 300; width: 80%; max-width: 400px; }
        .toast { background: rgba(0, 0, 0, 0.9); color: #fff; padding: 12px 24px; border-radius: 2px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); animation: slideDown 0.3s ease-out; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; border-left: 4px solid var(--accent); text-align: center; }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .hidden { display: none !important; }
        
        /* Mobile Only CSS */
        @media (hover: none) and (pointer: coarse) {
            #mobile-controls { display: block; }
            #score-p1, #score-p2 { top: 10px; font-size: 1.2rem; padding: 5px 10px; }
            #killfeed { font-size: 1.8rem; top: 25%; }
            #ammo-hud { bottom: 100px; right: 170px; } /* Move ammo so it doesn't cover mobile buttons */
            #btn-rematch { width: 250px; }
        }
    </style>
</head>
<body>

<div id="game-layer"></div>

<div id="ui-layer">
    <div id="hud">
        <div id="win-limit">TARGET SCORE: <span id="target-score-display">30</span></div>
        
        <div id="score-p1" class="score-box">YOU: 0</div>
        <div id="score-p2" class="score-box">ENEMY: 0</div>
        
        <div id="killfeed">ELIMINATED</div>
        
        <!-- Ammo -->
        <div id="ammo-hud">
            <span id="ammo-label">AMMO</span>
            <div id="ammo-count">5/5</div>
            <div id="reloading-text">RELOADING...</div>
        </div>

        <div id="crosshair">
            <div class="ch-line ch-v"></div>
            <div class="ch-line ch-h"></div>
        </div>
        <div id="hitmarker">
            <div class="hm-line hm-1"></div>
            <div class="hm-line hm-2"></div>
        </div>
        
        <div id="scope">
            <div class="scope-overlay"></div>
            <div class="scope-reticle">
                <div class="scope-cross sc-v"></div>
                <div class="scope-cross sc-h"></div>
                <div class="scope-center-dot"></div>
            </div>
            <div class="scope-data"><span id="dist-val">--</span>m</div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <div id="joystick-area"><div id="joystick-knob"></div></div>
        <div id="sprint-toggle">SPRINT</div>
        <div id="scope-btn">SCOPE</div>
    </div>

    <!-- Rematch Overlay -->
    <div id="rematch-panel">
        <h2 id="end-msg">GAME OVER</h2>
        <button id="btn-rematch">REQUEST REMATCH</button>
        <div id="rematch-status" style="margin-top: 15px; color: #aaa; font-size: 0.9rem; font-family: var(--font-ui);">WAITING FOR OPPONENT...</div>
    </div>
</div>

<div id="toast-container"></div>

<div id="menu-layer">
    <div id="panel-main" class="panel">
        <h1>SNIPER OPS</h1>
        <div style="margin-bottom:20px; color:#888; font-size:0.9rem; letter-spacing:1px;">TACTICAL DAYLIGHT OPERATIONS</div>
        <input type="text" id="inp-name" placeholder="OPERATOR NAME" maxlength="12">
        <div style="margin-bottom:20px; font-size:0.8rem; color:#888; display: flex; justify-content: space-between; align-items:center;">
            <span>KILL LIMIT:</span>
            <input type="number" id="inp-win-score" value="30" style="width:70px; margin:0; padding:10px;">
        </div>
        <button id="btn-host">HOST MATCH</button>
        <button id="btn-join">JOIN MATCH</button>
        
        <div class="footer">
            Join our <a href="https://discord.gg/ZCG4hB2HHp" target="_blank">Discord Server</a>
        </div>
    </div>

    <div id="panel-host" class="panel hidden">
        <h2>LOBBY</h2>
        <div style="margin-bottom:10px; color:#888; font-size:0.8rem; letter-spacing:1px;">ROOM CODE</div>
        <input type="text" id="host-code" readonly style="cursor:pointer; color:var(--accent); font-size:1.4rem; letter-spacing:2px; border-color:var(--accent);">
        
        <div style="margin: 20px 0; padding: 15px; background: #151515; border: 1px solid #333; border-radius: 2px;">
            <div style="font-size:0.8rem; color:#666; margin-bottom:5px; letter-spacing:1px;">OPERATIVES</div>
            <div id="lobby-list" style="font-weight:bold; text-align:left; padding-left: 10px; font-family: var(--font-ui);">
                <div id="lobby-host-name" style="color:var(--accent);">HOST: ...</div>
                <div id="lobby-client-name" style="color:#444; margin-top:5px;">WAITING FOR PLAYER...</div>
            </div>
        </div>

        <button id="btn-start" disabled>DEPLOY</button>
        <button id="btn-back" class="btn-red">EXIT</button>
    </div>

    <div id="panel-join" class="panel hidden">
        <h2>JOIN ROOM</h2>
        <input type="text" id="inp-code" placeholder="ENTER ROOM CODE">
        <button id="btn-connect">CONNECT</button>
        <div id="client-status" style="margin-top:15px; color:#888; font-size:0.8rem; min-height:20px;"></div>
        <button id="btn-back-2" class="btn-red">BACK</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
/**
 * AIM2: SNIPER OPS - DAYLIGHT EDITION
 * Updates: Dark UI, Mobile Controls, Score Sync, Smooth Graphics
 */

const CFG = { 
    baseSpeed: 160, 
    sprintSpeed: 210, 
    jumpForce: 35, 
    gravity: 100, 
    friction: 0.9,         
    airControl: 0.3, 
    sens: 0.002, 
    scopeSens: 0.0004, 
    tickRate: 30, 
    winScore: 30,
    maxAmmo: 5,
    reloadTime: 2000, // ms
    isMobile: ('ontouchstart' in window) || (navigator.maxTouchPoints > 0)
};

const State = { 
    isHost: false, conn: null, peer: null, 
    playing: false, gameOver: false, 
    myName: "ALPHA", enemyName: "BRAVO", 
    me: { 
        pos: new THREE.Vector3(0,50,0), 
        vel: new THREE.Vector3(), 
        rot: {x:0, y:0}, 
        onGround: false, 
        scoped: false, 
        dead: false,
        sprinting: false,
        ammo: CFG.maxAmmo,
        reloading: false
    }, 
    headBobTimer: 0, 
    weaponSway: new THREE.Vector2(),
    recoil: 0,
    players: {}, 
    lastFrame: 0, 
    lastTick: 0, 
    keys: {},
    score: { me: 0, enemy: 0 },
    mobileSprint: false
};

// --- AUDIO SYSTEM (Procedural) ---
const Sfx = { 
    ctx: null, 
    bufferNoise: null,
    init: () => { 
        if(!Sfx.ctx) Sfx.ctx = new (window.AudioContext||window.webkitAudioContext)();
        if(!Sfx.bufferNoise) {
            const bufferSize = Sfx.ctx.sampleRate * 2; 
            const buffer = Sfx.ctx.createBuffer(1, bufferSize, Sfx.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            Sfx.bufferNoise = buffer;
        }
    }, 
    play: (type) => { 
        if(!Sfx.ctx) Sfx.init(); 
        if(Sfx.ctx.state === 'suspended') Sfx.ctx.resume(); 
        const t = Sfx.ctx.currentTime; 
        
        if(type === 'shoot') { 
            const src = Sfx.ctx.createBufferSource();
            src.buffer = Sfx.bufferNoise;
            const gain = Sfx.ctx.createGain();
            const filter = Sfx.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, t);
            filter.frequency.exponentialRampToValueAtTime(100, t + 0.2);
            gain.gain.setValueAtTime(0.4, t); 
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2); 
            src.connect(filter); filter.connect(gain); gain.connect(Sfx.ctx.destination); 
            src.start(t); src.stop(t+0.2);
        } else if (type === 'hit') { 
            const osc = Sfx.ctx.createOscillator(); 
            const gain = Sfx.ctx.createGain(); 
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(1200, t); 
            osc.frequency.exponentialRampToValueAtTime(100, t + 0.1); 
            gain.gain.setValueAtTime(0.3, t); 
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1); 
            osc.connect(gain); gain.connect(Sfx.ctx.destination); 
            osc.start(t); osc.stop(t+0.1); 
        } else if (type === 'step') {
            const osc = Sfx.ctx.createOscillator();
            const gain = Sfx.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(80, t);
            osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.1);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.1);
            osc.connect(gain); gain.connect(Sfx.ctx.destination);
            osc.start(t); osc.stop(t+0.1);
        } else if (type === 'reload') {
            const osc = Sfx.ctx.createOscillator();
            const gain = Sfx.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(600, t);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            osc.connect(gain); gain.connect(Sfx.ctx.destination);
            osc.start(t); osc.stop(t+0.05);
            
            const osc2 = Sfx.ctx.createOscillator();
            const gain2 = Sfx.ctx.createGain();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(800, t + 0.2);
            gain2.gain.setValueAtTime(0.1, t + 0.2);
            gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            osc2.connect(gain2); gain2.connect(Sfx.ctx.destination);
            osc2.start(t + 0.2); osc2.stop(t + 0.25);
        } else if (type === 'empty') {
            const osc = Sfx.ctx.createOscillator();
            const gain = Sfx.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, t);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.05);
            osc.connect(gain); gain.connect(Sfx.ctx.destination);
            osc.start(t); osc.stop(t+0.05);
        }
    } 
};

// --- GRAPHICS & 3D ---
const Gfx = { 
    scene: null, camera: null, renderer: null, colliders: [],
    weaponGroup: null, laserLine: null,
    particles: [], 

    init: () => { 
        Gfx.scene = new THREE.Scene(); 
        Gfx.scene.background = new THREE.Color(0x87CEEB); // Daytime Sky (Kept as requested)
        // NO FOG
        
        Gfx.camera = new THREE.PerspectiveCamera(85, innerWidth/innerHeight, 0.1, 500); 
        
        // Optimized Renderer with Anti-aliasing enabled for smoother edges
        Gfx.renderer = new THREE.WebGLRenderer({ 
            antialias: true, // FIX: Pixelated edges
            powerPreference: "high-performance" 
        }); 
        
        // Cap pixel ratio to 2 for mobile to balance smoothness and performance
        const dpr = CFG.isMobile ? Math.min(window.devicePixelRatio, 2) : Math.min(window.devicePixelRatio, 1.5);
        Gfx.renderer.setPixelRatio(dpr); 
        Gfx.renderer.setSize(innerWidth, innerHeight); 
        Gfx.renderer.shadowMap.enabled = true;
        Gfx.renderer.shadowMap.type = THREE.BasicShadowMap; 
        
        document.getElementById('game-layer').appendChild(Gfx.renderer.domElement); 
        
        // Brighter Lighting for Daytime
        const amb = new THREE.AmbientLight(0xffffff, 0.8); 
        Gfx.scene.add(amb); 
        
        const dir = new THREE.DirectionalLight(0xffffff, 0.8); 
        dir.position.set(50, 100, 50); 
        dir.castShadow = true;
        dir.shadow.mapSize.width = 1024; // Increased shadow res for better quality
        dir.shadow.mapSize.height = 1024;
        dir.shadow.camera.near = 0.5;
        dir.shadow.camera.far = 300;
        dir.shadow.camera.left = -100;
        dir.shadow.camera.right = 100;
        dir.shadow.camera.top = 100;
        dir.shadow.camera.bottom = -100;
        Gfx.scene.add(dir); 
        
        Gfx.buildMap(); 
        Gfx.buildWeapon();
    }, 
    
    createNameSprite: (name) => { 
        const canvas = document.createElement('canvas'); 
        const ctx = canvas.getContext('2d'); 
        canvas.width = 256; canvas.height = 64; 
        ctx.font = "Bold 40px 'Black Ops One'"; 
        ctx.fillStyle = "#000000"; 
        ctx.textAlign = "center"; 
        ctx.shadowColor="white"; ctx.shadowBlur=4; 
        ctx.fillText(name, 128, 48); 
        const tex = new THREE.CanvasTexture(canvas); 
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true })); 
        sprite.scale.set(6, 1.5, 1); 
        return sprite; 
    }, 

    buildWeapon: () => {
        Gfx.weaponGroup = new THREE.Group();
        const matBlack = new THREE.MeshLambertMaterial({color: 0x222222});
        const matDarkGrey = new THREE.MeshLambertMaterial({color: 0x555555});
        const matAccent = new THREE.MeshBasicMaterial({color: 0xff9d00}); 

        // Simple Sniper Construct
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 1.2), matDarkGrey);
        body.position.set(0.2, -0.3, -0.5);
        Gfx.weaponGroup.add(body);
        
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 1.5, 8), matBlack);
        barrel.rotation.x = Math.PI/2;
        barrel.position.set(0.2, -0.25, -1.3);
        Gfx.weaponGroup.add(barrel);

        const scopeCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5, 12), matBlack);
        scopeCyl.rotation.z = Math.PI/2;
        scopeCyl.position.set(0.2, -0.1, -0.5);
        Gfx.weaponGroup.add(scopeCyl);
        
        const lens = new THREE.Mesh(new THREE.CircleGeometry(0.05, 16), matAccent);
        lens.position.set(-0.05, -0.1, -0.5);
        lens.rotation.y = -Math.PI/2;
        Gfx.weaponGroup.add(lens);

        // Laser Sight
        const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-100)]);
        const laserMat = new THREE.LineBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.5 });
        Gfx.laserLine = new THREE.Line(laserGeo, laserMat);
        Gfx.laserLine.position.set(0.2, -0.3, -2.0);
        Gfx.laserLine.visible = false;
        Gfx.weaponGroup.add(Gfx.laserLine);

        Gfx.camera.add(Gfx.weaponGroup);
        Gfx.scene.add(Gfx.camera);
    },

    buildMap: () => { 
        const matFloor = new THREE.MeshLambertMaterial({color: 0x999999}); 
        const matWall = new THREE.MeshLambertMaterial({color: 0xdddddd}); 
        const matTrim = new THREE.MeshBasicMaterial({color: 0xff9d00}); 
        
        // Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), matFloor); 
        floor.rotation.x = -Math.PI/2; 
        floor.receiveShadow = true;
        Gfx.scene.add(floor); 
        
        const createBox = (w,h,d,x,y,z, mat, cast=true) => { 
            const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); 
            m.position.set(x,y,z); 
            if(cast) m.castShadow = true;
            m.receiveShadow = true;
            Gfx.addColl(m); 
        }; 

        // Outer Walls
        createBox(200, 40, 10, 0, 20, -100, matWall); 
        createBox(200, 40, 10, 0, 20, 100, matWall); 
        createBox(10, 40, 200, -100, 20, 0, matWall); 
        createBox(10, 40, 200, 100, 20, 0, matWall); 

        // Center Structure
        createBox(20, 15, 20, 0, 7.5, 0, matWall); 
        createBox(22, 1, 22, 0, 15.1, 0, matTrim); 
        
        // Floating Platforms
        createBox(15, 1, 15, 40, 10, 40, matWall);
        createBox(15, 1, 15, -40, 15, -40, matWall);

        // Obstacles
        const pillars = [[-60, 0], [60, 0], [-60, 60], [60, -60], [0, 80], [0, -80]];
        pillars.forEach(p => { 
            createBox(8, 18, 8, p[0], 9, p[1], matWall); 
            const t = new THREE.Mesh(new THREE.BoxGeometry(8.1, 0.5, 8.1), matTrim); 
            t.position.set(p[0], 18, p[1]); 
            Gfx.scene.add(t); 
        }); 
    }, 

    addColl: (mesh) => { Gfx.scene.add(mesh); Gfx.colliders.push(mesh); }, 

    createPlayer: () => { 
        const g = new THREE.Group(); 
        const b = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.9, 1.0), new THREE.MeshLambertMaterial({color: 0x333333})); 
        b.position.y = 0.95; 
        b.castShadow = true;
        const h = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({color: 0xcc3333})); 
        h.position.y = 2.1; 
        g.add(b,h); 
        
        const nameSprite = Gfx.createNameSprite(State.enemyName); 
        nameSprite.position.y = 3.0; 
        g.add(nameSprite); 
        g.userData.nameTag = nameSprite; 
        Gfx.scene.add(g); 
        return g; 
    }, 

    spawnParticles: (pos, color, count, speed) => {
        const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const mat = new THREE.MeshBasicMaterial({color: color});
        
        for(let i=0; i<count; i++) {
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            mesh.position.x += (Math.random() - 0.5) * 0.5;
            mesh.position.y += (Math.random() - 0.5) * 0.5;
            mesh.position.z += (Math.random() - 0.5) * 0.5;
            
            const vel = new THREE.Vector3(
                (Math.random() - 0.5) * speed,
                (Math.random() - 0.5) * speed,
                (Math.random() - 0.5) * speed
            );
            
            Gfx.particles.push({ mesh, vel, life: 1.0 });
            Gfx.scene.add(mesh);
        }
    },

    updateParticles: (dt) => {
        for(let i = Gfx.particles.length - 1; i >= 0; i--) {
            const p = Gfx.particles[i];
            p.life -= dt * 2.0; 
            p.mesh.position.addScaledVector(p.vel, dt * 5);
            p.mesh.rotation.x += dt * 5;
            p.mesh.scale.setScalar(p.life);
            
            if(p.life <= 0) {
                Gfx.scene.remove(p.mesh);
                p.mesh.geometry.dispose();
                Gfx.particles.splice(i, 1);
            }
        }
    },

    tracer: (start, end) => { 
        const pts = [start, end]; 
        const geo = new THREE.BufferGeometry().setFromPoints(pts); 
        const mat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }); 
        const line = new THREE.Line(geo, mat); 
        Gfx.scene.add(line); 
        Gfx.spawnParticles(end, 0xffaa00, 5, 2); 
        setTimeout(() => { Gfx.scene.remove(line); geo.dispose(); mat.dispose(); }, 50); 
    } 
}; 

// --- NETWORKING ---
const Net = { 
    init: (role) => { 
        const n = document.getElementById('inp-name').value.trim(); 
        if(!n) return UI.toast("ENTER OPERATOR NAME", "error");
        State.myName = n.substring(0,12).toUpperCase(); 
        State.peer = new Peer(); 
        
        State.peer.on('open', id => { 
            if(role === 'host') { 
                State.isHost = true; 
                CFG.winScore = parseInt(document.getElementById('inp-win-score').value) || 30; 
                document.getElementById('target-score-display').innerText = CFG.winScore;
                document.getElementById('host-code').value = id; 
                
                document.getElementById('lobby-host-name').innerText = "HOST: " + State.myName;

                UI.showPanel('panel-host');
                
                State.peer.on('connection', conn => { 
                    State.conn = conn; 
                    Net.setup(); 
                }); 
            } else { 
                const code = document.getElementById('inp-code').value; 
                if(!code) return UI.toast("ENTER ROOM CODE", "error");
                document.getElementById('btn-connect').innerText = "CONNECTING..."; 
                State.conn = State.peer.connect(code); 
                Net.setup(); 
            } 
        });
        
        State.peer.on('error', err => {
            console.error(err);
            UI.toast("NETWORK ERROR", "error");
            if(role === 'client') document.getElementById('btn-connect').innerText = "RETRY";
        });
    }, 
    
    setup: () => { 
        State.conn.on('open', () => { 
            State.conn.send({ t:'name', n: State.myName }); 
            
            if(State.isHost) {
                document.getElementById('btn-start').disabled = false;
                document.getElementById('btn-start').innerText = "DEPLOY";
            } else {
                document.getElementById('panel-join').innerHTML = "<h2>CONNECTED</h2><div style='color:#00ffcc; margin-top:20px; font-size:1.2rem'>WAITING FOR HOST...</div>";
            }
        }); 
        
        State.conn.on('data', data => { 
            switch(data.t) { 
                case 'name': 
                    State.enemyName = data.n; 
                    if(State.isHost) {
                        document.getElementById('lobby-client-name').innerText = "GUEST: " + State.enemyName;
                        document.getElementById('lobby-client-name').style.color = "#fff";
                        UI.toast(State.enemyName + " JOINED");
                    }
                    break; 
                case 'start': 
                    CFG.winScore = data.ws; 
                    document.getElementById('target-score-display').innerText = CFG.winScore; 
                    UI.startGame(); 
                    break; 
                case 'm': 
                    if(!State.players['enemy']) State.players['enemy'] = { mesh: Gfx.createPlayer(), targetPos: new THREE.Vector3(), dead: false }; 
                    const en = State.players['enemy']; 
                    en.targetPos.copy(data.p); 
                    en.mesh.rotation.y = data.r; 
                    en.mesh.visible = !data.d;  
                    en.dead = data.d; 
                    break; 
                case 's': 
                    Gfx.tracer(data.o, data.d); 
                    Sfx.play('shoot'); 
                    if(State.players['enemy'] && State.players['enemy'].mesh) {
                        const flash = new THREE.PointLight(0xffaa00, 0.5, 10);
                        flash.position.copy(data.o);
                        Gfx.scene.add(flash);
                        setTimeout(() => Gfx.scene.remove(flash), 50);
                    }
                    break; 
                case 'hit': 
                    // FIX: When I receive 'hit', it means I was shot.
                    // Therefore, the ENEMY scored. I update their score locally.
                    if(!State.me.dead && !State.gameOver) {
                        State.score.enemy++;
                        UI.updateScore();
                        Logic.die();
                    }
                    break; 
                case 'rematch': 
                    UI.toast("OPPONENT REQUESTED REMATCH");
                    Logic.resetGame(); 
                    break;
            } 
        }); 
        
        State.conn.on('close', () => {
            UI.toast("CONNECTION LOST", "error");
            State.playing = false;
            setTimeout(() => location.reload(), 2000);
        });
    }, 
    
    broadcast: () => { 
        if(!State.conn || !State.playing) return; 
        const now = performance.now(); 
        if(now - State.lastTick < (1000 / CFG.tickRate)) return; 
        State.lastTick = now; 
        
        State.conn.send({ 
            t: 'm', p: State.me.pos, r: State.me.rot.y, 
            d: State.me.dead 
        }); 
    } 
};

// --- GAME LOGIC ---
const Logic = { 
    loop: (t) => { 
        requestAnimationFrame(Logic.loop); 
        const dt = Math.min((t - State.lastFrame)/1000, 0.1); 
        State.lastFrame = t; 
        
        if(State.playing) { 
            if(!State.gameOver) Logic.physics(dt); 
            
            // FIX: Update NameTag rotation to look at camera to prevent glitching
            const p = State.players['enemy']; 
            if(p && p.mesh) {
                p.mesh.position.lerp(p.targetPos, 0.2);
                if(p.mesh.userData.nameTag) {
                    p.mesh.userData.nameTag.lookAt(Gfx.camera.position);
                }
            }
            
            Gfx.updateParticles(dt);
            Gfx.renderer.render(Gfx.scene, Gfx.camera); 
            
            if(!State.gameOver) Net.broadcast(); 
        } 
    }, 
    
    spawn: () => { 
        const spawns = [ 
            new THREE.Vector3(-80, 5, -80), new THREE.Vector3(80, 5, 80), 
            new THREE.Vector3(-80, 5, 80), new THREE.Vector3(80, 5, -80) 
        ]; 
        const pt = spawns[Math.floor(Math.random() * spawns.length)]; 
        State.me.pos.copy(pt); 
        State.me.vel.set(0,0,0); 
        State.me.onGround = false; 
        State.me.dead = false; 
        State.me.scoped = false; 
        State.me.ammo = CFG.maxAmmo;
        State.me.reloading = false;
        State.recoil = 0;
        UI.updateAmmo();
        document.getElementById('scope').style.display = 'none'; 
        document.getElementById('crosshair').style.display = 'block'; 
        Gfx.laserLine.visible = false;
    }, 
    
    reload: () => {
        if(State.me.reloading || State.me.ammo === CFG.maxAmmo) return;
        State.me.reloading = true;
        UI.updateAmmo();
        Sfx.play('reload');
        
        setTimeout(() => {
            State.me.ammo = CFG.maxAmmo;
            State.me.reloading = false;
            UI.updateAmmo();
        }, CFG.reloadTime);
    },
    
    physics: (dt) => { 
        if(State.me.dead) return; 
        const { me, keys } = State; 
        
        const isMoving = (keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD']);
        // Check Sprint (Desktop Shift or Mobile Toggle)
        const isSprinting = (State.mobileSprint || keys['ShiftLeft']) && !me.scoped && isMoving && !me.reloading;
        const speed = isSprinting ? CFG.sprintSpeed : CFG.baseSpeed; 
        
        const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), me.rot.y); 
        const right = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), me.rot.y); 
        const inputDir = new THREE.Vector3(); 
        if(keys['KeyW']) inputDir.add(fwd); 
        if(keys['KeyS']) inputDir.sub(fwd); 
        if(keys['KeyA']) inputDir.sub(right); 
        if(keys['KeyD']) inputDir.add(right); 
        if(inputDir.length() > 0) inputDir.normalize(); 
        
        const accel = speed * dt * (me.onGround ? 1.0 : CFG.airControl); 
        if(inputDir.length() > 0) me.vel.add(inputDir.multiplyScalar(accel)); 
        
        const friction = me.onGround ? CFG.friction : 0.98; 
        me.vel.x *= friction; me.vel.z *= friction; 
        
        if(keys['Space'] && me.onGround) { me.vel.y = CFG.jumpForce; me.onGround = false; } 
        me.vel.y -= CFG.gravity * dt; 
        
        const resolve = (axis) => { 
            const nextPos = me.pos.clone(); 
            if(axis === 'x') nextPos.x += me.vel.x * dt; 
            if(axis === 'z') nextPos.z += me.vel.z * dt; 
            const pBox = new THREE.Box3().setFromCenterAndSize( 
                nextPos.clone().add(new THREE.Vector3(0, 1.5, 0)), 
                new THREE.Vector3(1.0, 3, 1.0) 
            ); 
            for(let c of Gfx.colliders) { 
                const b = new THREE.Box3().setFromObject(c); 
                if(b.intersectsBox(pBox)) return true; 
            } 
            return false; 
        } 
        
        if(!resolve('x')) me.pos.x += me.vel.x * dt; else me.vel.x = 0; 
        if(!resolve('z')) me.pos.z += me.vel.z * dt; else me.vel.z = 0; 
        
        me.pos.y += me.vel.y * dt; 
        
        if(me.pos.y < -60) Logic.die(); 
        if(me.pos.y <= 0) { 
            me.pos.y = 0; 
            if(me.vel.y < 0) me.vel.y = 0; 
            me.onGround = true; 
        } else { 
            if(me.vel.y <= 0) { 
                const ray = new THREE.Raycaster(me.pos.clone().add(new THREE.Vector3(0,1,0)), new THREE.Vector3(0,-1,0)); 
                const hits = ray.intersectObjects(Gfx.colliders); 
                if(hits.length > 0 && hits[0].distance < 1.1) { 
                    me.pos.y = hits[0].point.y; 
                    me.vel.y = 0; 
                    me.onGround = true; 
                } else { me.onGround = false; } 
            } else { me.onGround = false; } 
        } 

        let camY = me.pos.y + 2.4; 
        
        const time = performance.now() * 0.001;
        let bobX = 0, bobY = 0;
        
        if(me.onGround && isMoving && !me.scoped) {
            const bobFreq = isSprinting ? 15 : 10;
            const bobAmp = isSprinting ? 0.08 : 0.04;
            State.headBobTimer += dt * bobFreq;
            bobY = Math.sin(State.headBobTimer) * bobAmp;
            bobX = Math.cos(State.headBobTimer * 0.5) * bobAmp;
            
            if(Math.abs(Math.sin(State.headBobTimer)) > 0.9 && (State.headBobTimer % 2 > 1)) {
                if(State.lastStepTime === undefined || time - State.lastStepTime > 0.3) {
                    Sfx.play('step');
                    State.lastStepTime = time;
                }
            }
        } else {
            State.weaponSway.x = Math.sin(time) * 0.003;
            State.weaponSway.y = Math.cos(time * 0.8) * 0.003;
        }

        if(State.recoil > 0) State.recoil = Math.max(0, State.recoil - dt * 5);

        Gfx.camera.position.set(me.pos.x, camY + bobY, me.pos.z); 
        Gfx.camera.rotation.set(me.rot.x + State.recoil, me.rot.y, 0, 'YXZ'); 

        if(Gfx.weaponGroup) {
            const basePos = new THREE.Vector3(0.3, -0.3 + bobY, -0.5 + (isSprinting ? -0.2 : 0)); 
            const sway = new THREE.Vector2(bobX, bobY);
            
            Gfx.weaponGroup.position.copy(basePos);
            Gfx.weaponGroup.position.x += sway.x;
            Gfx.weaponGroup.position.z += State.recoil * 0.5;
            Gfx.weaponGroup.rotation.x = State.recoil; 
            Gfx.weaponGroup.rotation.y = -sway.x; 
            
            if(me.reloading) {
                Gfx.weaponGroup.rotation.x = -Math.PI/4;
                Gfx.weaponGroup.position.y -= 0.2;
            }
        }

        const baseFov = 85; 
        const targetFov = me.scoped ? 15 : (isSprinting ? 95 : baseFov); 
        Gfx.camera.fov += (targetFov - Gfx.camera.fov) * 0.3; 
        Gfx.camera.updateProjectionMatrix(); 
        
        if(me.scoped && Gfx.laserLine) {
            Gfx.laserLine.visible = true;
            const laserRay = new THREE.Raycaster(Gfx.camera.position, Gfx.camera.getWorldDirection(new THREE.Vector3()));
            const hits = laserRay.intersectObjects([...Gfx.colliders, State.players['enemy']?.mesh].filter(x=>x));
            if(hits.length > 0) {
                const dist = hits[0].distance;
                Gfx.laserLine.scale.z = dist / 100;
            }
        } else if(Gfx.laserLine) {
            Gfx.laserLine.visible = false;
        }

        if(me.scoped) { 
            const p = State.players['enemy']; 
            if(p && p.mesh) { 
                const d = me.pos.distanceTo(p.mesh.position).toFixed(0);
                document.getElementById('dist-val').innerText = d;
            } 
        } 
    }, 
    
    shoot: () => { 
        if(State.me.dead || State.gameOver || State.me.reloading) return; 
        
        if(State.me.ammo <= 0) {
            Sfx.play('empty');
            UI.toast("PRESS R TO RELOAD", "error");
            return;
        }

        State.me.ammo--;
        UI.updateAmmo();
        
        Sfx.play('shoot'); 
        State.recoil = 0.1;
        
        const ray = new THREE.Raycaster(); 
        ray.setFromCamera({x:0, y:0}, Gfx.camera); 
        
        const gunPos = Gfx.camera.position.clone().add(new THREE.Vector3(0.3, -0.3, 0.5).applyQuaternion(Gfx.camera.quaternion)); 
        const end = new THREE.Vector3().copy(Gfx.camera.position).add(ray.ray.direction.clone().multiplyScalar(300)); 
        
        Gfx.tracer(gunPos, end); 
        State.conn.send({ t:'s', o: gunPos, d: end }); 
        
        const obstacles = [...Gfx.colliders]; 
        const p = State.players['enemy']; 
        if(p && p.mesh && !p.dead) obstacles.push(p.mesh); 
        const hits = ray.intersectObjects(obstacles, true); 
        
        if(hits.length > 0) { 
            let hitEnemy = false; 
            let obj = hits[0].object; 
            while(obj.parent && obj.parent.type !== 'Scene') { 
                if(obj.parent === p.mesh) { hitEnemy = true; break; } 
                obj = obj.parent; 
            } 
            
            if(hitEnemy) { 
                Sfx.play('hit'); 
                Gfx.spawnParticles(hits[0].point, 0xff0000, 10, 4); 
                UI.showHitMarker();
                UI.feed(`HIT ${State.enemyName}`); 
                
                // FIX: I hit the enemy, so I increment MY score.
                // I send 'hit' to them so they can increment MY score on THEIR screen.
                State.score.me++;
                UI.updateScore();
                
                State.conn.send({ t:'hit' });
                
                if(State.score.me >= CFG.winScore) { 
                    Logic.endGame(true); 
                    State.conn.send({ t:'win' }); 
                }
            }
        } 
    }, 
    
    die: () => { 
        State.me.dead = true; 
        State.me.pos.y = -100; 
        UI.feed("ELIMINATED"); 
        setTimeout(() => Logic.spawn(), 2500); 
    }, 
    
    endGame: (iWon) => { 
        State.gameOver = true; 
        if(!CFG.isMobile) document.exitPointerLock(); 
        const feed = document.getElementById('killfeed'); 
        feed.style.opacity = 0; 
        
        const panel = document.getElementById('rematch-panel');
        const msg = document.getElementById('end-msg');
        const btn = document.getElementById('btn-rematch');
        const status = document.getElementById('rematch-status');
        
        panel.style.display = 'flex';
        panel.style.pointerEvents = 'auto';
        
        if(iWon) {
            msg.innerText = "VICTORY";
            msg.className = "win-txt";
        } else {
            msg.innerText = "DEFEAT";
            msg.className = "lose-txt";
        }
        
        status.innerText = "WAITING FOR OPPONENT...";
        btn.innerText = "REQUEST REMATCH";
        btn.disabled = false;
        btn.onclick = () => {
            btn.innerText = "WAITING...";
            btn.disabled = true;
            status.innerText = "REQUEST SENT";
            State.conn.send({ t: 'rematch' });
        };
    },

    resetGame: () => {
        State.score.me = 0;
        State.score.enemy = 0;
        State.gameOver = false;
        UI.updateScore();
        
        document.getElementById('rematch-panel').style.display = 'none';
        document.getElementById('rematch-panel').style.pointerEvents = 'none';
        
        Logic.spawn();
        if(!CFG.isMobile) document.body.requestPointerLock();
    }
}; 

window.onload = () => { 
    Gfx.init(); 
    Logic.loop(0); 
    
    // --- DESKTOP INPUTS ---
    window.onkeydown = e => { 
        State.keys[e.code] = true; 
        if(e.code === 'KeyR' && State.playing && !State.gameOver && !State.me.dead) Logic.reload();
    }; 
    window.onkeyup = e => State.keys[e.code] = false; 
    
    window.onmousedown = e => { 
        if(document.pointerLockElement !== document.body) { 
            if(State.playing && !State.gameOver && document.getElementById('rematch-panel').style.display === 'none') {
                document.body.requestPointerLock(); 
            }
            return; 
        } 
        if(e.button === 2) { 
            State.me.scoped = true; 
            document.getElementById('scope').style.display = 'block'; 
            document.getElementById('crosshair').style.display = 'none'; 
        } 
    }; 
    
    window.onmouseup = e => { 
        if(e.button === 2 && State.me.scoped) { 
            Logic.shoot(); 
            State.me.scoped = false; 
            document.getElementById('scope').style.display = 'none'; 
            document.getElementById('crosshair').style.display = 'block'; 
        } 
    }; 
    
    window.onmousemove = e => { 
        if(document.pointerLockElement !== document.body || State.me.dead || State.gameOver) return; 
        const s = State.me.scoped ? CFG.scopeSens : CFG.sens; 
        State.me.rot.y -= e.movementX * s; 
        State.me.rot.x -= e.movementY * s; 
        State.me.rot.x = Math.max(-1.5, Math.min(1.5, State.me.rot.x)); 
    }; 
    
    // --- MOBILE CONTROLS (JOYSTICK & BUTTONS) ---
    const joystick = document.getElementById('joystick-area');
    const knob = document.getElementById('joystick-knob');
    const scopeBtn = document.getElementById('scope-btn');
    const sprintBtn = document.getElementById('sprint-toggle');
    let joyCenter = { x:0, y:0 };
    let joyTouchId = null;

    joystick.addEventListener('touchstart', e => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        joyTouchId = touch.identifier;
        const rect = joystick.getBoundingClientRect();
        joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        updateJoystick(touch);
    });

    joystick.addEventListener('touchmove', e => {
        e.preventDefault();
        for(let i=0; i<e.changedTouches.length; i++){
            if(e.changedTouches[i].identifier === joyTouchId) {
                updateJoystick(e.changedTouches[i]);
            }
        }
    });

    const endJoystick = (e) => {
        for(let i=0; i<e.changedTouches.length; i++){
            if(e.changedTouches[i].identifier === joyTouchId) {
                joyTouchId = null;
                knob.style.transform = `translate(-50%, -50%)`;
                State.keys['KeyW'] = false;
                State.keys['KeyS'] = false;
                State.keys['KeyA'] = false;
                State.keys['KeyD'] = false;
            }
        }
    };
    
    joystick.addEventListener('touchend', endJoystick);
    joystick.addEventListener('touchcancel', endJoystick);

    function updateJoystick(touch) {
        const maxDist = 45;
        let dx = touch.clientX - joyCenter.x;
        let dy = touch.clientY - joyCenter.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if(dist > maxDist) {
            dx = (dx/dist) * maxDist;
            dy = (dy/dist) * maxDist;
        }
        
        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        
        // Map to Keys
        const threshold = 10;
        State.keys['KeyW'] = dy < -threshold;
        State.keys['KeyS'] = dy > threshold;
        State.keys['KeyA'] = dx < -threshold;
        State.keys['KeyD'] = dx > threshold;
    }

    // Mobile Look (Drag on right side of screen area if not using joystick)
    let lookTouchId = null;
    let lastLookX = 0;
    let lastLookY = 0;
    
    // Simple touch look for screen area outside controls
    document.getElementById('ui-layer').addEventListener('touchstart', e => {
        // Ignore touches on controls
        if(e.target.closest('#mobile-controls')) return;
        
        for(let i=0; i<e.changedTouches.length; i++){
            const t = e.changedTouches[i];
            if(t.clientX > window.innerWidth / 2) {
                lookTouchId = t.identifier;
                lastLookX = t.clientX;
                lastLookY = t.clientY;
            }
        }
    });

    document.getElementById('ui-layer').addEventListener('touchmove', e => {
        if(lookTouchId === null) return;
        for(let i=0; i<e.changedTouches.length; i++){
            const t = e.changedTouches[i];
            if(t.identifier === lookTouchId) {
                const dx = t.clientX - lastLookX;
                const dy = t.clientY - lastLookY;
                lastLookX = t.clientX;
                lastLookY = t.clientY;
                
                const s = State.me.scoped ? CFG.scopeSens * 100 : CFG.sens * 100; // Scale for touch
                State.me.rot.y -= dx * s;
                State.me.rot.x -= dy * s;
                State.me.rot.x = Math.max(-1.5, Math.min(1.5, State.me.rot.x));
            }
        }
    });

    const endLook = (e) => {
        for(let i=0; i<e.changedTouches.length; i++){
            if(e.changedTouches[i].identifier === lookTouchId) {
                lookTouchId = null;
            }
        }
    };
    document.getElementById('ui-layer').addEventListener('touchend', endLook);
    document.getElementById('ui-layer').addEventListener('touchcancel', endLook);

    // Sprint Button
    sprintBtn.addEventListener('touchstart', e => {
        e.preventDefault();
        State.mobileSprint = !State.mobileSprint;
        sprintBtn.classList.toggle('active', State.mobileSprint);
    });

    // Scope Button (Hold to Scope, Release to Shoot)
    scopeBtn.addEventListener('touchstart', e => {
        e.preventDefault();
        if(State.playing && !State.gameOver && !State.me.dead) {
            State.me.scoped = true; 
            document.getElementById('scope').style.display = 'block'; 
            document.getElementById('crosshair').style.display = 'none'; 
        }
    });

    scopeBtn.addEventListener('touchend', e => {
        e.preventDefault();
        if(State.me.scoped) {
            Logic.shoot(); 
            State.me.scoped = false; 
            document.getElementById('scope').style.display = 'none'; 
            document.getElementById('crosshair').style.display = 'block'; 
        }
    });


    // UI Events
    document.getElementById('btn-host').onclick = () => Net.init('host'); 
    document.getElementById('btn-join').onclick = () => { 
        UI.showPanel('panel-join');
    }; 
    
    document.getElementById('btn-connect').onclick = () => Net.init('client'); 
    
    document.getElementById('btn-start').onclick = () => { 
        if(State.conn) { 
            State.conn.send({ t:'start', ws: CFG.winScore }); 
            UI.startGame(); 
        } 
    }; 
    
    document.getElementById('host-code').onclick = (e) => { 
        navigator.clipboard.writeText(e.target.value).then(() => {
            UI.toast("ROOM CODE COPIED");
        });
    }; 
    
    document.getElementById('btn-back').onclick = () => location.reload(); 
    document.getElementById('btn-back-2').onclick = () => UI.showPanel('panel-main'); 
}; 

</script>
</body>
</html>
