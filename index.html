<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIM2: PRO (STABLE)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        /* --- THEME --- */
        :root { --bg: #050505; --panel: #111; --accent: #00ffcc; --danger: #ff0044; }

        body {
            margin: 0; overflow: hidden; background: var(--bg); color: #ccc;
            font-family: 'Share Tech Mono', monospace; user-select: none;
        }

        /* --- LAYOUT --- */
        #game-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #menu-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #2a2a2a 0%, #000 100%); }

        /* --- MENUS --- */
        .panel {
            background: rgba(10, 10, 10, 0.95); border: 1px solid #333; padding: 40px;
            width: 400px; text-align: center; box-shadow: 0 0 30px rgba(0,255,204,0.1);
            pointer-events: auto; backdrop-filter: blur(5px);
            border-top: 2px solid var(--accent);
        }

        h1 { margin: 0 0 20px 0; color: var(--accent); letter-spacing: 4px; font-size: 2rem; text-shadow: 0 0 10px var(--accent); }
        h2 { font-size: 1rem; color: #888; margin-bottom: 20px; letter-spacing: 2px; }

        input {
            width: 100%; padding: 10px; background: #000; border: 1px solid #333;
            color: white; font-family: inherit; font-size: 1.2rem; text-align: center;
            margin-bottom: 15px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,204,0.2); }

        button {
            width: 100%; padding: 12px; cursor: pointer; background: #1a1a1a; color: var(--accent);
            border: 1px solid var(--accent); font-family: inherit; font-size: 1rem; font-weight: bold;
            text-transform: uppercase; transition: all 0.2s; margin-bottom: 10px; letter-spacing: 1px;
        }
        button:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
        button:disabled { filter: grayscale(1); cursor: not-allowed; }
        
        .btn-red { border-color: var(--danger); color: var(--danger); }
        .btn-red:hover { background: var(--danger); color: white; box-shadow: 0 0 15px var(--danger); }

        /* --- HUD --- */
        #hud { display: none; }
        .score-box {
            position: absolute; top: 30px; font-size: 3rem; font-weight: bold;
            text-shadow: 0 0 10px black;
        }
        #score-p1 { left: 40px; color: var(--accent); }
        #score-p2 { right: 40px; color: var(--danger); text-align: right; }
        
        #win-limit {
            position: absolute; top: 15px; width: 100%; text-align: center;
            font-size: 0.8rem; color: #555; letter-spacing: 2px;
        }

        #killfeed {
            position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; text-shadow: 0 0 10px #000; text-align: center; color: white;
            white-space: pre-wrap; opacity: 0; transition: opacity 0.2s;
        }

        /* --- CROSSHAIR --- */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 24px; height: 24px;
        }
        .ch-line { position: absolute; background: var(--accent); box-shadow: 0 0 4px var(--accent); }
        .ch-v { width: 2px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
        .ch-h { width: 100%; height: 2px; left: 0; top: 50%; transform: translateY(-50%); }

        /* --- ADVANCED SCOPE --- */
        #scope {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
        }
        .scope-overlay {
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 25%, rgba(0,0,0,0.4) 30%, #000 60%);
        }
        .scope-reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            border: 2px solid rgba(255, 0, 0, 0.3);
            border-radius: 50%;
            box-shadow: 0 0 100px inset rgba(0,0,0,0.5);
        }
        .scope-cross {
            position: absolute; background: #ff0000;
        }
        .sc-v { width: 1px; height: 100%; left: 50%; top: 0; opacity: 0.7; }
        .sc-h { width: 100%; height: 1px; top: 50%; left: 0; opacity: 0.7; }
        
        .scope-dot {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; background: #ff0000; border-radius: 50%;
            box-shadow: 0 0 10px #ff0000;
        }
        .scope-data {
            position: absolute; color: rgba(255,0,0,0.6); font-size: 12px;
        }
        .sd-1 { top: 51%; left: 52%; }
        .sd-2 { top: 48%; right: 40%; }
        
        @keyframes breathe { 
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.02); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        .breathing { animation: breathe 4s ease-in-out infinite; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-layer"></div>

<div id="ui-layer">
    <div id="hud">
        <div id="win-limit">FIRST TO 30 WINS</div>
        <div id="score-p1" class="score-box">0</div>
        <div id="score-p2" class="score-box">0</div>
        
        <div id="killfeed"></div>

        <div id="crosshair">
            <div class="ch-line ch-v"></div>
            <div class="ch-line ch-h"></div>
        </div>

        <div id="scope">
            <div class="scope-overlay"></div>
            <div class="scope-reticle breathing">
                <div class="scope-cross sc-v"></div>
                <div class="scope-cross sc-h"></div>
                <div class="scope-dot"></div>
                <div class="scope-data sd-1">DIST: <span id="dist-val">--</span>m</div>
                <div class="scope-data sd-2">WIND: 0.0</div>
            </div>
        </div>
    </div>
</div>

<div id="menu-layer">
    <!-- MAIN MENU -->
    <div id="panel-main" class="panel">
        <h1>AIM2: PRO</h1>
        <input type="text" id="inp-name" placeholder="YOUR NAME" maxlength="8">
        <div style="margin-bottom:20px; font-size:0.8rem; color:#666; display: flex; justify-content: space-between;">
            <span>WIN SCORE:</span>
            <input type="number" id="inp-win-score" value="30" style="width:50px; margin:0; padding:2px;">
        </div>
        <button id="btn-host">HOST MATCH</button>
        <button id="btn-join">JOIN MATCH</button>
        <div style="margin-top:20px; font-size: 0.7rem; color: #444;">CONTROLS: WASD + SPACE + C (SLIDE) <br> RELEASE RMB TO SHOOT</div>
    </div>

    <!-- HOST WAITING -->
    <div id="panel-host" class="panel hidden">
        <h2>DEPLOYMENT CODE</h2>
        <input type="text" id="host-code" readonly style="cursor:pointer; color:var(--accent);">
        <p style="color:#666; font-size:0.8rem;">SEND TO FRIEND</p>
        <div id="host-status" style="margin:20px 0; color:#fff; font-weight:bold;">WAITING...</div>
        <button id="btn-start" disabled>START GAME</button>
        <button id="btn-back" class="btn-red">CANCEL</button>
    </div>

    <!-- CLIENT JOINING -->
    <div id="panel-join" class="panel hidden">
        <h2>ENTER CODE</h2>
        <input type="text" id="inp-code" placeholder="PASTE CODE">
        <button id="btn-connect">CONNECT</button>
        <div id="client-status" style="margin-top:10px; color:#888;"></div>
        <button id="btn-back-2" class="btn-red">BACK</button>
    </div>
</div>

<!-- LIBS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
/**
 * AIM2: PRO VERSION (STABLE)
 * Fixed: Spawn death loop, tunneling, collision logic.
 */

// CONFIG
const CFG = {
    baseSpeed: 130,
    sprintSpeed: 150,
    crouchSpeed: 40,
    jumpForce: 35,
    gravity: 90,
    friction: 0.82,     
    airControl: 0.3,
    sens: 0.002,
    scopeSens: 0.0004,
    tickRate: 30,
    winScore: 30
};

const State = {
    isHost: false,
    conn: null,
    peer: null,
    playing: false,
    gameOver: false,
    myName: "PLAYER",
    enemyName: "ENEMY",
    
    me: { 
        pos: new THREE.Vector3(0,50,0), 
        vel: new THREE.Vector3(), 
        rot: {x:0, y:0}, 
        onGround: false,
        scoped: false,
        crouching: false,
        dead: false
    },
    
    headBobTimer: 0,
    players: {},
    lastFrame: 0,
    lastTick: 0,
    keys: {}
};

// --- AUDIO ---
const Sfx = {
    ctx: null,
    init: () => { Sfx.ctx = new (window.AudioContext||window.webkitAudioContext)(); },
    play: (type) => {
        if(!Sfx.ctx) Sfx.init();
        if(Sfx.ctx.state === 'suspended') Sfx.ctx.resume();
        const t = Sfx.ctx.currentTime;
        const o = Sfx.ctx.createOscillator();
        const g = Sfx.ctx.createGain();
        
        if(type === 'shoot') {
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(150, t);
            o.frequency.exponentialRampToValueAtTime(0.01, t+0.3);
            g.gain.setValueAtTime(0.5, t);
            g.gain.exponentialRampToValueAtTime(0.01, t+0.3);
        } else if (type === 'hit') {
            o.type = 'sine';
            o.frequency.setValueAtTime(800, t);
            g.gain.setValueAtTime(0.3, t);
            g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
        } else if (type === 'step') {
            o.type = 'triangle';
            o.frequency.setValueAtTime(50, t);
            g.gain.setValueAtTime(0.1, t);
            g.gain.linearRampToValueAtTime(0, t+0.05);
        }

        o.connect(g); g.connect(Sfx.ctx.destination);
        o.start(t); o.stop(t+0.3);
    }
};

// --- GRAPHICS ---
const Gfx = {
    scene: null, camera: null, renderer: null,
    colliders: [],
    
    init: () => {
        Gfx.scene = new THREE.Scene();
        Gfx.scene.background = new THREE.Color(0x111111);
        Gfx.scene.fog = new THREE.Fog(0x111111, 20, 180);

        Gfx.camera = new THREE.PerspectiveCamera(85, innerWidth/innerHeight, 0.1, 300);
        
        Gfx.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        Gfx.renderer.setSize(innerWidth, innerHeight);
        document.getElementById('game-layer').appendChild(Gfx.renderer.domElement);

        // Lights
        const amb = new THREE.AmbientLight(0xffffff, 0.6);
        Gfx.scene.add(amb);
        const sun = new THREE.DirectionalLight(0x00ffcc, 0.5);
        sun.position.set(20, 50, 20);
        Gfx.scene.add(sun);

        Gfx.buildMap();
    },

    createNameSprite: (name) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 256; canvas.height = 64;
        ctx.font = "Bold 40px Arial";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.strokeStyle = "black";
        ctx.lineWidth = 4;
        ctx.strokeText(name, 128, 48);
        ctx.fillText(name, 128, 48);
        
        const tex = new THREE.CanvasTexture(canvas);
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(8, 2, 1);
        sprite.position.y = 3.5;
        return sprite;
    },

    buildMap: () => {
        const matFloor = new THREE.MeshLambertMaterial({color: 0x222222});
        const matWall = new THREE.MeshLambertMaterial({color: 0x444444});
        const matNeon = new THREE.MeshBasicMaterial({color: 0x00ffcc});

        // Floor (Visual Only, collision is in Physics)
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), matFloor);
        floor.rotation.x = -Math.PI/2;
        Gfx.scene.add(floor);
        
        const grid = new THREE.GridHelper(200, 50, 0x333333, 0x111111);
        Gfx.scene.add(grid);

        // Walls
        const createBox = (w,h,d,x,y,z, mat) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
            m.position.set(x,y,z);
            Gfx.addColl(m);
        };

        createBox(200, 40, 5, 0, 20, -100, matWall);
        createBox(200, 40, 5, 0, 20, 100, matWall);
        createBox(5, 40, 200, -100, 20, 0, matWall);
        createBox(5, 40, 200, 100, 20, 0, matWall);

        // Obstacles
        const pillars = [[-40, -40], [40, 40], [-40, 40], [40, -40]];
        pillars.forEach(p => {
            createBox(15, 12, 15, p[0], 6, p[1], matWall);
            const n = new THREE.Mesh(new THREE.BoxGeometry(15.1, 0.5, 15.1), matNeon);
            n.position.set(p[0], 12, p[1]);
            Gfx.scene.add(n);
        });

        // Center
        createBox(20, 20, 20, 0, 10, 0, matWall);
        
        // Steps
        createBox(10, 2, 10, 0, 1, 25, matWall);
        createBox(10, 6, 10, 0, 3, 18, matWall);
        createBox(10, 10, 10, 0, 5, 11, matWall);
    },

    addColl: (mesh) => {
        Gfx.scene.add(mesh);
        Gfx.colliders.push(mesh);
    },

    createPlayer: () => {
        const g = new THREE.Group();
        const b = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.2, 1.0), new THREE.MeshLambertMaterial({color: 0x333333}));
        b.position.y = 1.1;
        const h = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshBasicMaterial({color: 0xff0044}));
        h.position.y = 2.6;
        g.add(b,h);
        
        const nameSprite = Gfx.createNameSprite(State.enemyName);
        g.add(nameSprite);
        g.userData.nameTag = nameSprite;

        Gfx.scene.add(g);
        return g;
    },

    tracer: (start, end) => {
        const pts = [start, end];
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const mat = new THREE.LineBasicMaterial({
            color: 0xffff00, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending
        });
        const line = new THREE.Line(geo, mat);
        Gfx.scene.add(line);
        let op = 1;
        const fade = setInterval(() => {
            op -= 0.1;
            if(op <= 0) { clearInterval(fade); Gfx.scene.remove(line); }
            else mat.opacity = op;
        }, 30);
    }
};

// --- NETWORKING ---
const Net = {
    init: (role) => {
        const n = document.getElementById('inp-name').value.trim();
        if(!n) return alert("ENTER NAME");
        State.myName = n.substring(0,8).toUpperCase();

        State.peer = new Peer();
        State.peer.on('open', id => {
            if(role === 'host') {
                State.isHost = true;
                CFG.winScore = parseInt(document.getElementById('inp-win-score').value) || 30;
                document.getElementById('win-limit').innerText = `FIRST TO ${CFG.winScore} WINS`;
                document.getElementById('host-code').value = id;
                document.getElementById('panel-main').classList.add('hidden');
                document.getElementById('panel-host').classList.remove('hidden');
                
                State.peer.on('connection', conn => {
                    State.conn = conn;
                    Net.setup();
                    document.getElementById('host-status').innerText = "ENEMY DETECTED";
                    document.getElementById('host-status').style.color = "#00ffcc";
                    document.getElementById('btn-start').disabled = false;
                });
            } else {
                const code = document.getElementById('inp-code').value;
                if(!code) return alert("ENTER CODE");
                document.getElementById('btn-connect').innerText = "CONNECTING...";
                State.conn = State.peer.connect(code);
                Net.setup();
            }
        });
    },

    setup: () => {
        State.conn.on('open', () => {
            State.conn.send({ t:'name', n: State.myName });
            if(!State.isHost) document.getElementById('panel-join').innerHTML = "<h2>CONNECTED</h2><div style='color:#fff; margin-top:20px'>WAITING FOR HOST...</div>";
        });

        State.conn.on('data', data => {
            switch(data.t) {
                case 'name': State.enemyName = data.n; break;
                case 'start':
                    CFG.winScore = data.ws;
                    document.getElementById('win-limit').innerText = `FIRST TO ${CFG.winScore} WINS`;
                    UI.startGame();
                    break;
                case 'm':
                    if(!State.players['enemy']) State.players['enemy'] = { mesh: Gfx.createPlayer(), targetPos: new THREE.Vector3(), dead: false };
                    const en = State.players['enemy'];
                    en.targetPos.copy(data.p);
                    en.mesh.rotation.y = data.r;
                    en.mesh.visible = !data.d; 
                    en.mesh.children[0].scale.y = data.c ? 0.5 : 1.0;
                    en.mesh.children[0].position.y = data.c ? 0.55 : 1.1;
                    en.mesh.children[1].position.y = data.c ? 1.4 : 2.6;
                    en.mesh.userData.nameTag.position.y = data.c ? 2.0 : 3.5;
                    en.dead = data.d;
                    break;
                case 's': Gfx.tracer(data.o, data.d); Sfx.play('shoot'); break;
                case 'hit': if(!State.me.dead && !State.gameOver) Logic.die(); break;
                case 'u': UI.updateScore(data.h, data.c); break;
                case 'win': Logic.endGame(data.w); break;
            }
        });
    },

    broadcast: () => {
        if(!State.conn || !State.playing) return;
        const now = performance.now();
        if(now - State.lastTick < (1000 / CFG.tickRate)) return;
        State.lastTick = now;
        
        State.conn.send({
            t: 'm', p: State.me.pos, r: State.me.rot.y,
            d: State.me.dead, c: State.me.crouching
        });
    }
};

// --- LOGIC ---
const Logic = {
    loop: (t) => {
        requestAnimationFrame(Logic.loop);
        const dt = Math.min((t - State.lastFrame)/1000, 0.1);
        State.lastFrame = t;

        if(State.playing && !State.gameOver) {
            Logic.physics(dt);
            const p = State.players['enemy'];
            if(p && p.mesh) p.mesh.position.lerp(p.targetPos, 0.2);
            Gfx.renderer.render(Gfx.scene, Gfx.camera);
            Net.broadcast();
        }
    },

    spawn: () => {
        const spawns = [
            new THREE.Vector3(-80, 10, -80), new THREE.Vector3(80, 10, 80),
            new THREE.Vector3(-80, 10, 80), new THREE.Vector3(80, 10, -80)
        ];
        const pt = spawns[Math.floor(Math.random() * spawns.length)];
        
        State.me.pos.copy(pt);
        State.me.vel.set(0,0,0);
        State.me.onGround = false;
        State.me.dead = false;
        
        Gfx.camera.fov = 85;
        Gfx.camera.updateProjectionMatrix();
    },

    physics: (dt) => {
        if(State.me.dead) return;

        const { me, keys } = State;
        const crouchInput = keys['KeyC'] || keys['ControlLeft'];
        const isSprinting = keys['ShiftLeft'] && keys['KeyW'] && !me.scoped && !crouchInput;
        
        let speed = CFG.baseSpeed;
        if(isSprinting) speed = CFG.sprintSpeed;
        
        if(crouchInput) {
            const planarSpeed = Math.sqrt(me.vel.x**2 + me.vel.z**2);
            if(planarSpeed > CFG.baseSpeed * 0.8) {
                me.crouching = true;
                speed = 0; // Slide
            } else {
                me.crouching = true;
                speed = CFG.crouchSpeed;
            }
        } else {
            me.crouching = false;
        }

        const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), me.rot.y);
        const right = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), me.rot.y);
        const inputDir = new THREE.Vector3();

        if(keys['KeyW']) inputDir.add(fwd);
        if(keys['KeyS']) inputDir.sub(fwd);
        if(keys['KeyA']) inputDir.sub(right);
        if(keys['KeyD']) inputDir.add(right);
        if(inputDir.length() > 0) inputDir.normalize();

        const accel = speed * dt * (me.onGround ? 1.0 : CFG.airControl);
        if(inputDir.length() > 0) me.vel.add(inputDir.multiplyScalar(accel));

        let friction = CFG.friction;
        if(me.crouching && me.onGround) friction = 0.98;
        else if(!me.onGround) friction = 0.95;

        me.vel.x *= friction; me.vel.z *= friction;

        if(keys['Space'] && me.onGround) { me.vel.y = CFG.jumpForce; me.onGround = false; }

        me.vel.y -= CFG.gravity * dt;

        // Collision X/Z
        const resolve = (axis) => {
            const nextPos = me.pos.clone();
            if(axis === 'x') nextPos.x += me.vel.x * dt;
            if(axis === 'z') nextPos.z += me.vel.z * dt;
            
            const pBox = new THREE.Box3().setFromCenterAndSize(
                nextPos.clone().add(new THREE.Vector3(0, me.crouching ? 0.75 : 1.5, 0)),
                new THREE.Vector3(1.5, me.crouching ? 1.5 : 3, 1.5)
            );
            
            for(let c of Gfx.colliders) {
                const b = new THREE.Box3().setFromObject(c);
                if(b.intersectsBox(pBox)) return true;
            }
            return false;
        }

        if(!resolve('x')) me.pos.x += me.vel.x * dt; else me.vel.x = 0;
        if(!resolve('z')) me.pos.z += me.vel.z * dt; else me.vel.z = 0;
        
        me.pos.y += me.vel.y * dt;

        // --- GROUND & DEATH LOGIC (FIXED) ---
        
        // 1. Die if really low (fell off map)
        if(me.pos.y < -50) { 
             Logic.die(); 
             return; 
        } 
        
        // 2. Hard Floor Snap (Prevents falling through)
        // Since the visual floor is at y=0, and player position is at feet
        if(me.pos.y <= 0) {
            me.pos.y = 0;
            if(me.vel.y < 0) me.vel.y = 0;
            me.onGround = true;
        } else {
            // Check if just slightly above ground to snap (stairs/ramps)
            // Or if in air
            me.onGround = false;
        }
        
        // 3. Simple Check for obstacles below feet (e.g. stepping on boxes)
        // We do a raycast down if we are falling
        if(me.vel.y <= 0) {
            const ray = new THREE.Raycaster(new THREE.Vector3(me.pos.x, me.pos.y + 1, me.pos.z), new THREE.Vector3(0,-1,0));
            const hits = ray.intersectObjects(Gfx.colliders);
            if(hits.length > 0 && hits[0].distance < 1.1) {
                me.pos.y = hits[0].point.y;
                me.vel.y = 0;
                me.onGround = true;
            }
        }

        // Camera
        let camY = me.pos.y + (me.crouching ? 1.4 : 2.6);
        if(me.onGround && inputDir.lengthSq() > 0 && !me.crouching) {
            State.headBobTimer += dt * (isSprinting ? 18 : 12);
            camY += Math.sin(State.headBobTimer) * 0.15;
            if(Math.sin(State.headBobTimer) < -0.9) Sfx.play('step');
        }

        Gfx.camera.position.set(me.pos.x, camY, me.pos.z);
        Gfx.camera.rotation.set(me.rot.x, me.rot.y, 0, 'YXZ');

        const baseFov = 85;
        const targetFov = me.scoped ? 15 : (isSprinting ? 100 : baseFov);
        Gfx.camera.fov += (targetFov - Gfx.camera.fov) * 0.15;
        Gfx.camera.updateProjectionMatrix();

        if(me.scoped) {
            const p = State.players['enemy'];
            if(p && p.mesh) {
                const dist = me.pos.distanceTo(p.mesh.position).toFixed(1);
                document.getElementById('dist-val').innerText = dist;
            }
        }
    },

    shoot: () => {
        if(State.me.dead || State.gameOver) return;
        Sfx.play('shoot');
        State.me.rot.x += 0.08;
        const ray = new THREE.Raycaster();
        ray.setFromCamera({x:0, y:0}, Gfx.camera);
        const end = new THREE.Vector3().copy(Gfx.camera.position).add(ray.ray.direction.clone().multiplyScalar(300));
        const gunPos = Gfx.camera.position.clone().add(new THREE.Vector3(0.5, -0.5, 0.5).applyQuaternion(Gfx.camera.quaternion));
        Gfx.tracer(gunPos, end);
        State.conn.send({ t:'s', o: gunPos, d: end });

        const obstacles = [...Gfx.colliders];
        const p = State.players['enemy'];
        if(p && p.mesh && !p.dead) obstacles.push(p.mesh);

        const hits = ray.intersectObjects(obstacles, true);
        if(hits.length > 0) {
            let hitEnemy = false;
            let obj = hits[0].object;
            while(obj.parent && obj.parent.type !== 'Scene') {
                if(obj.parent === p.mesh) { hitEnemy = true; break; }
                obj = obj.parent;
            }
            if(hitEnemy) {
                Sfx.play('hit');
                UI.feed(`HIT ${State.enemyName}`);
                State.conn.send({ t:'hit' });
                Logic.onScore();
            }
        }
    },

    onScore: () => {
        let p1 = parseInt(document.getElementById('score-p1').innerText);
        let p2 = parseInt(document.getElementById('score-p2').innerText);
        if(State.isHost) p1++; else p2++;
        UI.updateScore(p1, p2);
        State.conn.send({ t:'u', h: p1, c: p2 });
        if( (State.isHost && p1 >= CFG.winScore) || (!State.isHost && p2 >= CFG.winScore) ) {
            Logic.endGame("VICTORY");
            State.conn.send({ t:'win', w: "DEFEAT" });
        }
    },

    die: () => {
        State.me.dead = true;
        State.me.pos.y = -50; 
        UI.feed("YOU DIED");
        setTimeout(() => Logic.spawn(), 2500);
    },

    endGame: (msg) => {
        State.gameOver = true;
        document.exitPointerLock();
        UI.feed(msg + "\nREFRESH TO RESET");
    }
};

const UI = {
    startGame: () => {
        document.getElementById('menu-layer').classList.add('hidden');
        document.getElementById('hud').style.display = 'block';
        State.playing = true;
        document.body.requestPointerLock();
        Logic.spawn();
    },
    updateScore: (h, c) => {
        const myScore = State.isHost ? h : c;
        const enScore = State.isHost ? c : h;
        document.getElementById('score-p1').innerText = myScore;
        document.getElementById('score-p2').innerText = enScore;
    },
    feed: (text) => {
        const el = document.getElementById('killfeed');
        el.innerText = text;
        el.style.opacity = 1;
        setTimeout(() => el.style.opacity = 0, 2000);
    }
};

window.onload = () => {
    Gfx.init();
    Logic.loop(0);
    window.onkeydown = e => State.keys[e.code] = true;
    window.onkeyup = e => State.keys[e.code] = false;

    window.onmousedown = e => {
        if(document.pointerLockElement!==document.body) { 
            if(State.playing && !State.gameOver) document.body.requestPointerLock(); 
            return; 
        }
        if(e.button === 2) { 
            State.me.scoped = true;
            document.getElementById('scope').style.display = 'block';
            document.getElementById('crosshair').style.display = 'none';
        }
    };
    
    window.onmouseup = e => {
        if(e.button === 2 && State.me.scoped) {
            Logic.shoot();
            State.me.scoped = false;
            document.getElementById('scope').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
        }
    };
    
    window.onmousemove = e => {
        if(document.pointerLockElement!==document.body || State.me.dead) return;
        const s = State.me.scoped ? CFG.scopeSens : CFG.sens;
        State.me.rot.y -= e.movementX * s;
        State.me.rot.x -= e.movementY * s;
        State.me.rot.x = Math.max(-1.5, Math.min(1.5, State.me.rot.x));
    };

    document.getElementById('btn-host').onclick = () => Net.init('host');
    document.getElementById('btn-join').onclick = () => {
        document.getElementById('panel-main').classList.add('hidden');
        document.getElementById('panel-join').classList.remove('hidden');
    };
    document.getElementById('btn-connect').onclick = () => Net.init('client');
    document.getElementById('btn-start').onclick = () => {
        if(State.conn) {
            State.conn.send({ t:'start', ws: CFG.winScore });
            UI.startGame();
        }
    };
    document.getElementById('host-code').onclick = (e) => { navigator.clipboard.writeText(e.target.value); alert("COPIED"); };
    document.getElementById('btn-back').onclick = () => location.reload();
    document.getElementById('btn-back-2').onclick = () => location.reload();
};
</script>
</body>
